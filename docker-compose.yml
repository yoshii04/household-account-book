services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: household_db
      POSTGRES_USER: household_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household_user -d household_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://household_user:${DB_PASSWORD}@db:5432/household_db
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./frontend/static:/app/static
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
